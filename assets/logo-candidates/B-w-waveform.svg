<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Witness — the letter W drawn as a voice waveform">
  <defs>
    <linearGradient id="b-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26406E"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#b-tile)"/>

  <!-- A W that is also a waveform: the name and the medium in one stroke. -->
  <path d="M28 44 L46 88 L64 54 L82 88 L100 44"
        fill="none" stroke="#FFFFFF" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The recording dot — small, warm, the only thing that moves. -->
  <circle cx="100" cy="44" r="8" fill="#F5B841"/>
</svg>
