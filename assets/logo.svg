<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Witness — shield holding spoken sound turning into written testimony">
  <defs>
    <linearGradient id="a-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22375F"/>
      <stop offset="1" stop-color="#0E1729"/>
    </linearGradient>
  </defs>

  <!-- The shield: protection is not decoration here, it is half the product. -->
  <path d="M64 8 L110 26 v40 c0 28-19 47-46 56-27-9-46-28-46-56V26 Z"
        fill="url(#a-body)"/>

  <!-- Upper half: what was SAID — a voice, still sound. -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="40" y1="46" x2="40" y2="58"/>
    <line x1="52" y1="38" x2="52" y2="66"/>
    <line x1="64" y1="31" x2="64" y2="73"/>
    <line x1="76" y1="38" x2="76" y2="66"/>
    <line x1="88" y1="46" x2="88" y2="58"/>
  </g>

  <!-- Lower half: what was WRITTEN — the same voice, now testimony that keeps. -->
  <g stroke="#F5B841" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="88" x2="88" y2="88"/>
    <line x1="40" y1="100" x2="76" y2="100"/>
  </g>
</svg>
